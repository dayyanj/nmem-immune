[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nmem-immune"
version = "0.1.0"
description = "Memory Immune System — poisoning protection for nmem"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    { name = "Dayyan Janjua" },
]

dependencies = [
    "asyncpg>=0.29",
    "numpy>=1.24",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nmem_immune"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
